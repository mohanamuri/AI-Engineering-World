[project]
name = "production-rag-langchain-reference"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  # Core framework
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",

  # LangChain ecosystem
  "langchain>=0.1.20",
  "langchain-openai>=0.1.0",
  "langchain-community>=0.0.30",
  "langsmith>=0.1.0",

  # Vectorstore & retrieval
  "chroma>=0.4.0",
  "langchain-chroma>=0.1.0",

  # Embeddings
  "sentence-transformers>=3.1",
  "langchain-huggingface>=0.0.10",
  "openai>=1.50",

  # Caching & performance
  "redis>=5.0",
  "tenacity>=9.0",

  # Observability
  "structlog>=24.4",
  "prometheus-client>=0.21",

  # Document loading & processing
  "python-docx>=0.8.11",
  "pypdf>=4.0.0",

  # Testing
  "pytest>=8.3",
  "pytest-asyncio>=0.23.0"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
